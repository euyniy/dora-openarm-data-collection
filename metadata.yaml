location: Lab
operator: Tester

tasks:
  # `prompt` / `description` はデータセットに記録される英語の指示。
  # `prompt_ja` / `description_ja` は作業者向けの表示専用（記録には影響しない）。
  - prompt: Pick a spoon.
    description: Pick a spoon on a table.
    prompt_ja: スプーンを取ってください。
    description_ja: テーブルの上のスプーンを取ってください。

equipment:
  id: Test
  version: "1.0"
  embodiments:
    arms:
      id: OpenArm
      version: "2.0"
    lifter:
      id: OpenArmCellLifter
      version: "1.0"
      mechanism: lead_screw
      lead_length: 5.0
      stroke: 300
      home: bottom
      unit: mm
  perceptions:
    cameras:
      wrist_left: {}
      wrist_right: {}
      ceiling: {}
      head_left: {}
      head_right: {}
