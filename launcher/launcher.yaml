# データ収集ランチャーの設定。
#
# `entries` に登録した 1 件につき 1 つのデスクトップショートカットが作られます
# (launcher/install.sh を実行)。収録するタスク (metadata) は entry の `tasks`
# に並べておき、起動後の画面で作業者が選びます。
# `shortcut: false` の entry はアイコンを作らず、メニュー画面からのみ選べます。

# ランチャー自身が待ち受けるポート。
port: 8080

# タスク画面 (dora-openarm-data-collection-ui) の URL。
# dataflow の ui ノードの PORT と合わせること。
ui_url: "http://127.0.0.1:8000/"

# dora は `uv run dora <サブコマンド> ... --uv` で実行する。
#
# uv の実行ファイル。省略 (null) すると
# <venv>/bin/uv → <リポジトリ>/.venv/bin/uv → ~/.local/bin/uv → PATH 上の uv
# の順に探す。
# 例: uv: "/home/openarm/.local/bin/uv"
uv: null

# uv を探すときに参照する Python 仮想環境。
# 例: venv: "/home/openarm/.venv"
venv: null

# dataflow / metadata を探すディレクトリ。
# 省略すると launcher.yaml の 1 つ上（リポジトリ直下）を使う。
repo_dir: null

# 収録データの保存先。 <root>/<日付>/<日時>/ に 1 セッション 1 フォルダで保存する。
# 例: /hdd_data/2026-08-06/2026-08-06_09-12-30/episodes/0/...
# 起動時にディレクトリを作成し、書き込めない場合（ディスク未マウント等）は
# 収集を始めずに画面へエラーを出す。
# entry ごとに `dataset_root:` を書くと上書きできる（ダミー収集など）。
# 一時的に変えたいときは環境変数 DATASET_ROOT でも上書きできる
# （優先順位: entry の dataset_root > DATASET_ROOT > ここの root）。
dataset:
  root: "/hdd_data"
  date_format: "%Y-%m-%d"
  session_format: "%Y-%m-%d_%H-%M-%S"

# 起動前に、前回の収集で残った dora のプロセスを停止する。
# （このリポジトリを作業ディレクトリにしている dora / ノードのみが対象）
cleanup_before_start: true

# WebXR 構成（entry の `webxr:`）の既定値。
# ヘッドセットのブラウザから HTTPS でつなぐので、
#   - 自己署名証明書が要る（launcher/install.sh が作る）
#   - 作業者に開いてもらう URL を画面に出す必要がある
# の 2 つが VR（Quest 専用アプリ + UDP）と違う。証明書が無いまま起動すると
# dora のスタックトレースになってしまうので、ランチャーが先に確認する。
#
#   webxr:
#     # 省略すると server.host（install.sh が書く）→
#     # <この PC のホスト名>.local の順に決める。
#     hostname: null
#     port: 8443
#     tls_certificate: "nodes/dora-openarm-webxr/example/server.crt"
#     tls_key: "nodes/dora-openarm-webxr/example/server.key"

# CAN インタフェースの設定コマンド。
# 再起動後や USB を挿し直した後に必要になる。sudo を無人で通すため、
# launcher/install.sh が /etc/sudoers.d/openarm-can を導入する。
can_setup:
  command: ["sudo", "-n", "/usr/bin/openarm-can-configure-socketcan-4-arms", "-fd"]
  # 設定対象のインタフェース。存在チェックと「設定済みか」の判定に使う。
  interfaces: ["can0", "can1", "can2", "can3"]

entries:
  # ショートカットは構成ごとに 1 つ（KER / VR / WebXR）。
  # どのタスク（metadata）を収録するかは、起動後の画面で選ぶ。
  - id: ker
    name: "KER データ収集"
    description: "KER リーダーで OpenArm を操作します"
    dataflow: "dataflow-ker.yaml"
    can_setup: true
    build: true
    tasks:
      # 収録するタスク（metadata）。起動後の画面で選ぶ。
      - id: standard
        name: "標準タスク"
        description: "metadata.yaml のタスク一式"
        metadata: "metadata.yaml"
      - id: tableware
        name: "食器タスク"
        description: "箸・スプーンの箱入れ／箱空け"
        metadata: "metadata_tableware.yaml"
      - id: pillowcase
        name: "枕カバータスク"
        description: "枕カバーの抜き取り／広げ／挿入"
        metadata: "metadata_pillowcase.yaml"

  - id: vr
    name: "VR データ収集"
    description: "Quest で OpenArm を操作します"
    dataflow: "dataflow-vr.yaml"
    can_setup: true
    build: true
    tasks:
      # 収録するタスク（metadata）。起動後の画面で選ぶ。
      - id: standard
        name: "標準タスク"
        description: "metadata.yaml のタスク一式"
        metadata: "metadata.yaml"
      - id: tableware
        name: "食器タスク"
        description: "箸・スプーンの箱入れ／箱空け"
        metadata: "metadata_tableware.yaml"
      - id: pillowcase
        name: "枕カバータスク"
        description: "枕カバーの抜き取り／広げ／挿入"
        metadata: "metadata_pillowcase.yaml"

  # VR と同じ実機構成だが、Quest 専用アプリではなくヘッドセットのブラウザ
  # (WebXR) でつなぐ。作業者は起動画面に出る URL をヘッドセットで開く。
  - id: webxr
    name: "WebXR データ収集"
    description: "ヘッドセットのブラウザで OpenArm を操作します"
    dataflow: "dataflow-webxr.yaml"
    can_setup: true
    build: true
    webxr:
      port: 8443
      tls_certificate: "nodes/dora-openarm-webxr/example/server.crt"
      tls_key: "nodes/dora-openarm-webxr/example/server.key"
    tasks:
      # 収録するタスク（metadata）。起動後の画面で選ぶ。
      - id: standard
        name: "標準タスク"
        description: "metadata.yaml のタスク一式"
        metadata: "metadata.yaml"
      - id: tableware
        name: "食器タスク"
        description: "箸・スプーンの箱入れ／箱空け"
        metadata: "metadata_tableware.yaml"
      - id: pillowcase
        name: "枕カバータスク"
        description: "枕カバーの抜き取り／広げ／挿入"
        metadata: "metadata_pillowcase.yaml"

  # 動作確認用。実機 (CAN / KER / カメラ) がなくても起動できるダミー構成。
  # デスクトップにアイコンは作らず、メニュー画面からのみ選べる。
  - id: dummy
    name: "ダミー収集（動作確認用）"
    description: "実機なしで画面と操作を確認します"
    dataflow: "dataflow_dummy.yaml"
    can_setup: false
    build: true
    shortcut: false
    # 動作確認のデータは本番の保存先に混ぜない。
    dataset_root: "dummy_data"
    tasks:
      # 収録するタスク（metadata）。起動後の画面で選ぶ。
      - id: standard
        name: "標準タスク"
        description: "metadata.yaml のタスク一式"
        metadata: "metadata.yaml"
      - id: tableware
        name: "食器タスク"
        description: "箸・スプーンの箱入れ／箱空け"
        metadata: "metadata_tableware.yaml"
      - id: pillowcase
        name: "枕カバータスク"
        description: "枕カバーの抜き取り／広げ／挿入"
        metadata: "metadata_pillowcase.yaml"

  # ヘッドセットの接続確認用。実機 (CAN / カメラ) は使わず MuJoCo の中の
  # OpenArm を動かす。証明書とヘッドセットの設定だけを確かめたいときに使う。
  # デスクトップにアイコンは作らず、メニュー画面からのみ選べる。
  - id: webxr-mujoco
    name: "WebXR 接続確認（MuJoCo）"
    description: "実機なしでヘッドセットからの操作を確認します"
    dataflow: "dataflow-webxr-mujoco.yaml"
    can_setup: false
    build: true
    shortcut: false
    webxr:
      port: 8443
      tls_certificate: "nodes/dora-openarm-webxr/example/server.crt"
      tls_key: "nodes/dora-openarm-webxr/example/server.key"
    # 動作確認のデータは本番の保存先に混ぜない。
    dataset_root: "dummy_data"
    tasks:
      - id: mujoco
        name: "MuJoCo タスク"
        description: "metadata_mujoco.yaml のタスク一式"
        metadata: "metadata_mujoco.yaml"
