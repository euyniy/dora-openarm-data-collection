# データ収集ランチャーの設定。
#
# `entries` に登録した 1 件につき 1 つのデスクトップショートカットが作られます
# (launcher/install.sh を実行)。メタデータ違いの収集を複数運用する場合は、
# 同じ dataflow に別の metadata を指定した entry を追加してください。

# ランチャー自身が待ち受けるポート。
port: 8080

# タスク画面 (dora-openarm-data-collection-ui) の URL。
# dataflow の ui ノードの PORT と合わせること。
ui_url: "http://127.0.0.1:8000/"

# dora は `uv run dora <サブコマンド> ... --uv` で実行する。
#
# uv の実行ファイル。省略 (null) すると
# <venv>/bin/uv → <リポジトリ>/.venv/bin/uv → ~/.local/bin/uv → PATH 上の uv
# の順に探す。
# 例: uv: "/home/openarm/.local/bin/uv"
uv: null

# uv を探すときに参照する Python 仮想環境。
# 例: venv: "/home/openarm/.venv"
venv: null

# dataflow / metadata を探すディレクトリ。
# 省略すると launcher.yaml の 1 つ上（リポジトリ直下）を使う。
repo_dir: null

# 起動前に、前回の収集で残った dora のプロセスを停止する。
# （このリポジトリを作業ディレクトリにしている dora / ノードのみが対象）
cleanup_before_start: true

# CAN インタフェースの設定コマンド。
# 再起動後や USB を挿し直した後に必要になる。sudo を無人で通すため、
# launcher/install.sh が /etc/sudoers.d/openarm-can を導入する。
can_setup:
  command: ["sudo", "-n", "/usr/bin/openarm-can-configure-socketcan-4-arms", "-fd"]
  # 設定対象のインタフェース。存在チェックと「設定済みか」の判定に使う。
  interfaces: ["can0", "can1", "can2", "can3"]

entries:
  - id: ker
    name: "KER データ収集"
    description: "KER リーダーで OpenArm を操作してデータを収集します"
    dataflow: "dataflow-ker.yaml"
    metadata: "metadata.yaml"
    can_setup: true
    build: true

  # メタデータ違いの例。dataflow は同じで metadata だけ差し替える。
  - id: ker-tableware
    name: "KER データ収集（食器タスク）"
    description: "箸・スプーンの箱入れ／箱空けを収集します"
    dataflow: "dataflow-ker.yaml"
    metadata: "metadata_tableware.yaml"
    can_setup: true
    build: true

  # 動作確認用。実機 (CAN / KER / カメラ) がなくても起動できるダミー構成。
  - id: dummy
    name: "ダミー収集（動作確認用）"
    description: "実機なしで画面と操作を確認します"
    dataflow: "dataflow_dummy.yaml"
    metadata: "metadata.yaml"
    can_setup: false
    build: true
