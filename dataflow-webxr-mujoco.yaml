nodes:
  - id: ui
    build: pip install -e nodes/dora-openarm-data-collection-ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "metadata_mujoco.yaml"
      # 作業者向けの操作マニュアル（タスク画面に表示）
      MANUAL_FILE: "docs/operation-manual-ja.yaml"
      # 異常終了したときに戻る起動画面（launcher/openarm_launcher.py）
      LAUNCHER_URL: "http://127.0.0.1:8080/"
    inputs:
      tick: dora/timer/secs/1
      button_a:
        source: webxr/button_a
        queue_size: 100
      button_b:
        source: webxr/button_b
        queue_size: 100
      vr_receive_times:
        source: webxr/vr_receive_times
        queue_size: 100
    outputs:
      - command

  - id: quittable-tick-leader
    build: pip install -e nodes/dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/secs/1
    outputs:
      - tick

  - id: webxr
    build: pip install -e nodes/dora-openarm-webxr
    path: dora-openarm-webxr
    env:
      # launcher/install.sh が作る自己署名証明書
      # （手で作る場合は nodes/dora-openarm-webxr/example/prepare_tls.sh）。
      TLS_CERTIFICATE_FILE: "nodes/dora-openarm-webxr/example/server.crt"
      TLS_KEY_FILE: "nodes/dora-openarm-webxr/example/server.key"
      # ヘッドセットに頭部カメラをどう出すか（view-webxr.yaml のコメント参照）
      VIEW_CONFIGURATION_FILE: "view-webxr.yaml"
    inputs:
      tick: quittable-tick-leader/tick
      # 最新フレームだけを見せる（実機版と同じ）。
      camera_head_right:
        source: mujoco-collect/camera_head_right
        queue_size: 1
      # view: stereo のときだけ使う。
      camera_head_left:
        source: mujoco-collect/camera_head_left
        queue_size: 1
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - joystick_x_right
      - joystick_y_right
      - joystick_x_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times
      - pose_reference

  - id: ik
    build: pip install -e nodes/dora-openarm-kinematics
    path: dora-openarm-ik
    args: "--mode bimanual --max-iters 10 --dt 0.1 --damping 0.1 --posture-cost 0.01 --lm-damping 0.01"
    inputs:
      target_right: webxr/pose_right
      target_left: webxr/pose_left
      trigger_right: webxr/trigger_right
      trigger_left: webxr/trigger_left
    outputs:
      - position_left
      - position_right
      - status

  # ── MuJoCo viewer (replaces follower-right, follower-left, and all cameras) ──
  - id: mujoco-collect
    build: pip install -e nodes/dora-openarm-mujoco
    path: dora-openarm-mujoco
    args: "--scene demo --keyframe home --enable-collision --ctrl --viewer --render"
    inputs:
      position_left: ik/position_left
      position_right: ik/position_right
      pose_right: webxr/pose_right
      pose_left: webxr/pose_left
      joystick_y: webxr/joystick_y_left
      button_x: webxr/button_x
    outputs:
      - status
      - arm_right_observation
      - arm_left_observation
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling

  - id: recorder
    build: pip install -e nodes/dora-openarm-dataset-recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "metadata_mujoco.yaml"
      DIRECTORY: "webxr_mujoco_data"
    inputs:
      command: ui/command
      arm_right_action: ik/position_right
      arm_right_observation: mujoco-collect/arm_right_observation
      arm_left_action: ik/position_left
      arm_left_observation: mujoco-collect/arm_left_observation
      camera_wrist_right: mujoco-collect/camera_wrist_right
      camera_wrist_left: mujoco-collect/camera_wrist_left
      camera_head_left: mujoco-collect/camera_head_left
      camera_head_right: mujoco-collect/camera_head_right
      camera_ceiling: mujoco-collect/camera_ceiling
