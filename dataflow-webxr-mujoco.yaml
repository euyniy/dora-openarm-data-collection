nodes:
  - id: ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "metadata_mujoco.yaml"
    inputs:
      tick: dora/timer/secs/1
      button_a:
        source: webxr/button_a
        queue_size: 100
      button_b:
        source: webxr/button_b
        queue_size: 100
      vr_receive_times:
        source: webxr/vr_receive_times
        queue_size: 100
    outputs:
      - command

  - id: quittable-tick-leader
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/millis/4
      # Close camera inputs along with tick on quit to break the WebXR/MuJoCo cycle.
      camera_head_right:
        source: mujoco-collect/camera_head_right
        queue_size: 1
      camera_head_left:
        source: mujoco-collect/camera_head_left
        queue_size: 1
    outputs:
      - tick
      - camera_head_right
      - camera_head_left

  - id: webxr
    path: dora-openarm-webxr
    env:
      TLS_CERTIFICATE_FILE: "nodes/dora-openarm-webxr/example/server.crt" # generate via nodes/dora-openarm-webxr/example/prepare_tls.sh
      TLS_KEY_FILE: "nodes/dora-openarm-webxr/example/server.key" # generate via nodes/dora-openarm-webxr/example/prepare_tls.sh
      VIEW_CONFIGURATION_FILE: "view-webxr.yaml"
    inputs:
      tick: quittable-tick-leader/tick
      camera_head_right:
        source: quittable-tick-leader/camera_head_right
        queue_size: 1
      camera_head_left:
        source: quittable-tick-leader/camera_head_left
        queue_size: 1
    outputs:
      - pose_right
      - trigger_right
      - grip_right
      - pose_left
      - trigger_left
      - grip_left
      - joystick_x_right
      - joystick_y_right
      - joystick_x_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times
      - pose_reference

  - id: ik
    path: dora-openarm-ik
    args: >-
      --mode bimanual --tick-hz 250
      --max-iters 5 --damping 0.1
      --posture-cost 0 --lm-damping 0.01 --limit-velocity
    inputs:
      target_right: webxr/pose_right
      target_left: webxr/pose_left
      trigger_right: webxr/trigger_right
      trigger_left: webxr/trigger_left
    outputs:
      - position_left
      - position_right
      - status

  # ── MuJoCo viewer (replaces follower-right, follower-left, and all cameras) ──
  - id: mujoco-collect
    path: dora-openarm-mujoco
    args: "--scene demo --keyframe home --enable-collision --ctrl --viewer --render --debug-frames"
    inputs:
      move_position_left: ik/position_left
      move_position_right: ik/position_right
      request_state: quittable-tick-leader/tick
      pose_right: webxr/pose_right
      pose_left: webxr/pose_left
      joystick_y: webxr/joystick_y_left
      button_x: webxr/button_x
    outputs:
      - status
      - state_right
      - state_left
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling

  - id: recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "metadata_mujoco.yaml"
      DIRECTORY: "webxr_mujoco_data"
    inputs:
      command: ui/command
      arm_right_action: ik/position_right
      arm_right_observation: mujoco-collect/state_right
      arm_left_action: ik/position_left
      arm_left_observation: mujoco-collect/state_left
      camera_wrist_right: mujoco-collect/camera_wrist_right
      camera_wrist_left: mujoco-collect/camera_wrist_left
      camera_head_left: mujoco-collect/camera_head_left
      camera_head_right: mujoco-collect/camera_head_right
      camera_ceiling: mujoco-collect/camera_ceiling
