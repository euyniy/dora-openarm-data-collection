# Minimal KER -> follower arms teleoperation for testing the KER filter.
# No UI, cameras or recorder. The arms start on startup and align once the
# KER gripper is squeezed; Ctrl-C stops them.
#
#   dora run test-ker-filter.yaml --uv

nodes:
  - id: ker
    path: dora-openarm-ker
    # Edit to compare: drop --one-euro for raw, or tune the parameters.
    args: "--one-euro --min-cutoff 5.0 --beta 5.0 --d-cutoff 5.0"
    inputs:
      # 250Hz
      tick: dora/timer/millis/4
    outputs:
      - follower_position_right
      - follower_position_left
      - metadata

  - id: right
    path: dora-openarm
    # Please configure! e.g. openarm_cell_higher_pd_zero_offset for the cell.
    args: >-
      --side right --align-trigger gripper --config openarm_pedestal
      --start-on-startup
    inputs:
      # Event ID is only used. Event value isn't used.
      request_state: ker/follower_position_right
      move_position: ker/follower_position_right
    outputs:
      - state
      - status

  - id: left
    path: dora-openarm
    # Please configure! e.g. openarm_cell_higher_pd_zero_offset for the cell.
    args: >-
      --side left --align-trigger gripper --config openarm_pedestal
      --start-on-startup
    inputs:
      request_state: ker/follower_position_left
      move_position: ker/follower_position_left
    outputs:
      - state
      - status
