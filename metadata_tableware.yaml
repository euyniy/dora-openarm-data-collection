# 食器の箱入れ・箱空けタスク（仮）。
# 起動時にどのメタデータで収集するかは launcher/launcher.yaml の entry で選ぶ。

location: Lab
operator: Tester

tasks:
  # `prompt` / `description` はデータセットに記録される英語の指示。
  # `description` には、そのタスクを始めるときの「期待する初期状態」を書く。
  # `prompt_ja` / `description_ja` は作業者向けの表示専用（記録には影響しない）。
  - prompt: Put the chopsticks into the brown box.
    description: >-
      The brown box is empty and placed on the right side of the table.
      Several pairs of chopsticks are scattered in front of the arms.
      The blue box is not on the table.
    prompt_ja: 箸を茶色の箱に入れてください。
    description_ja: >-
      初期状態: 茶色の箱を空のままテーブル右側に置き、箸を数膳アームの手前に
      ばらばらに並べます。青い箱はテーブルに出しません。

  - prompt: Put the spoons into the blue box.
    description: >-
      The blue box is empty and placed on the left side of the table.
      Several spoons are scattered in front of the arms.
      The brown box is not on the table.
    prompt_ja: スプーンを青い箱に入れてください。
    description_ja: >-
      初期状態: 青い箱を空のままテーブル左側に置き、スプーンを数本アームの
      手前にばらばらに並べます。茶色の箱はテーブルに出しません。

  - prompt: Flip the brown box to dump its contents.
    description: >-
      The brown box stands upright in the middle of the table and holds the
      chopsticks. The area in front of the box is clear so that the contents
      can be dumped there.
    prompt_ja: 茶色の箱をひっくり返して中身を出してください。
    description_ja: >-
      初期状態: 箸を入れた茶色の箱をテーブル中央に置きます。中身を出す
      スペースを箱の手前に空けておきます。

  - prompt: Flip the blue box to dump its contents.
    description: >-
      The blue box stands upright in the middle of the table and holds the
      spoons. The area in front of the box is clear so that the contents can
      be dumped there.
    prompt_ja: 青い箱をひっくり返して中身を出してください。
    description_ja: >-
      初期状態: スプーンを入れた青い箱をテーブル中央に置きます。中身を出す
      スペースを箱の手前に空けておきます。

equipment:
  id: Test
  version: "1.0"
  embodiments:
    arms:
      id: OpenArm
      version: "2.0"
    lifter:
      id: OpenArmCellLifter
      version: "1.0"
      mechanism: lead_screw
      lead_length: 5.0
      stroke: 300
      home: bottom
      unit: mm
  perceptions:
    cameras:
      wrist_left: {}
      wrist_right: {}
      ceiling: {}
      head_left: {}
      head_right: {}
